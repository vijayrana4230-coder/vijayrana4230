<!DOCTYPE html>
<html lang="en">

<head>
  <title>Document</title>
  <link rel="stylesheet" href="cube.css">
</head>

<body>
  <script>

    function cube() {
      let a = document.getElementById("value1").value;
      document.getElementById("result").innerHTML = "cube of " + a + " = " + a * a * a;
    }
    function square() {
      let a = document.getElementById("value1").value;
      document.getElementById("result").innerHTML = "square of " + a + " = " + a * a;
    }

    function clr() {
      let a = document.getElementById("value1").value = " ";
      document.getElementById("result").innerHTML = " ";
    }

  </script>
  <div id="main">
    <div id="box">
      <h1>find the cube and square</h1>
      <div id="inputbox">
        <input type="text" id="value1" placeholder="Enter the value"><br><br>
      </div>
      <div id="box1">
        <button type="button" onclick="cube()">cube</button>
        <button type="button" onclick="square()">square</button>
        <button type="button" onclick="clr()">clear</button>
      </div>
      <p id="result"></p>
    </div>
  </div>
</body>

</html>
